[project]
name = "snowy-sightings"
version = "0.1.0"
description = "Check eBird for recent snowy owl observations"
readme = "README.md"
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
]

[project.scripts]
snowy = "snowy_sightings.cli:app"

[build-system]
requires = ["uv_build>=0.9.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=7.0.0",
    "pytest>=9.0.2",
]

[tool.isort]
profile = "black"
